<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Cita?</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f7f9fa;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .gif-container {
            height: 300px;
            /* Incrementado un poco para que tu GIF se aprecie mejor */
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-height: 100%;
            border-radius: 10px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 150px;
        }

        button {
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #btn-yes {
            background-color: #4caf50;
            color: white;
        }

        #btn-no {
            background-color: #f44336;
            color: white;
        }

        #btn-calendar {
            background-color: rgb(0, 195, 255);
            color: white;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="gif-container">
            <img id="gif-display"
                src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM29icXNndXN6OHhodm95Ym96b3NyamV5bms2ZXg0M296cmN3eWV6MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif"
                alt="Gatito tierno">
        </div>

        <h1 id="question">¿Andre, quieres ir a una cita conmigo? (prueba el botón rojo un par de veces a ver qué pasa)</h1>

        <div class="buttons" id="buttons-container">
            <button id="btn-yes">Sí</button>
            <button id="btn-no">No</button>
        </div>
        <div class="calendar-button hidden" id="calendar-button-container">
            <button id="btn-calendar">Añadir cita a calendar</button>
        </div>
    </div>

    <script>
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const gifDisplay = document.getElementById('gif-display');
        const question = document.getElementById('question');
        const buttonsContainer = document.getElementById('buttons-container');
        const buttonCalendarContainer = document.getElementById('calendar-button-container');

        const animacionTriunfoSrc = "animacion.gif";
        const preloadedImage = new Image();
        preloadedImage.src = animacionTriunfoSrc;
        const noPhrases = [
            "¿Estás segura?",
            "¿Segura segura?",
            "¡¡Piénsalo bien!!",
            "¡Última oportunidad!",
            "No puede ser",
            "¡Te arrepentirás!",
            "¡Piénsalo!",
            "¿Estás absolutamente segura?",
            "¡Te podrías estar equivocando!",
            "Busca dentro de tu corazón",
            "No seas tan fría",
            "¿Cambio de opinión?",
            "Reconsidera, porfis",
            "Es tu respuesta final?",
            "Me rompes el mio cuore"
        ];

        let phraseIndex = 0;
        let yesButtonSize = 1.2;

        btnNo.addEventListener('click', () => {
            let phraseIndexAid = phraseIndex;
            btnNo.textContent = phraseIndex < noPhrases.length - 1 ? noPhrases[phraseIndex] : noPhrases[Math.floor(Math.random() * (noPhrases.length - 1 - 0 + 1)) + 0];

            phraseIndex++;

            yesButtonSize += 0.4;
            btnYes.style.fontSize = `${yesButtonSize}rem`;
            btnYes.style.padding = `${yesButtonSize * 10}px ${yesButtonSize * 20}px`;
        });

        btnYes.addEventListener('click', () => {
            // 1. Cambiamos el mensaje de celebración
            question.textContent = "Vamoooooosh! La cita será día 15 de junio del 2026 (sí, nos va bién, he mirado el calendar). Te pasaré a buscar.";

            // 2. Ocultamos los botones
            buttonsContainer.classList.add('hidden');
            buttonCalendarContainer.classList.remove('hidden');

            // 3. Cargamos tu GIF personalizado que está en la misma carpeta
            gifDisplay.src = animacionTriunfoSrc;

            const titulo = encodeURIComponent("Cita ❤️");
            const detalles = encodeURIComponent("¡Llegó el día de nuestra cita! Te pasaré a buscar.");

            // Las fechas en Google Calendar van en formato AAAAMMDD (el 15 de junio es 20260615)
            // Al ser un evento de todo el día, se pone la fecha de inicio y la de fin (que es el día siguiente)
            const fechaInicio = "20260615";
            const fechaFin = "20260616";

            // Construimos la URL de Google Calendar
            const googleCalendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titulo}&dates=${fechaInicio}/${fechaFin}&details=${detalles}`;

            // Programamos el botón del calendario para que abra el enlace en una nueva pestaña/app
            const btnCalendar = document.getElementById('btn-calendar');
            btnCalendar.addEventListener('click', () => {
                window.open(googleCalendarUrl, '_blank');
            });
        });
    </script>

</body>

</html>
